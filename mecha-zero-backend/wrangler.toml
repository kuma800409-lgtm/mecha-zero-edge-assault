name = "mecha-zero-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[durable_objects]
bindings = [
  { name = "GAME_ROOM", class_name = "GameRoom" },
  { name = "MATCHMAKER", class_name = "Matchmaker" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "Matchmaker"]

[vars]
TICK_RATE = "20"
MAX_PLAYERS_PER_ROOM = "100"
